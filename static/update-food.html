<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Food</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header> Update Food</header>

<div class="center-page">
    <div class="form-card">
        <h2>Edit Food</h2>

        <input id="foodName" placeholder="Food name">
        <input id="foodPrice" placeholder="Price">

        <div class="form-actions">
            <button class="btn-purple" onclick="updateFood()">Save</button>
            <button class="btn-blue" onclick="goBack()">Cancel</button>
        </div>
    </div>
</div>

<script src="update-food.js"></script>
</body>
</html>
