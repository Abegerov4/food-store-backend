<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">Food Store</div>
    <div class="header-right">
        <a href="/" class="link-btn">Back to shop</a>
    </div>
</header>

<section class="cart-page">
    <div class="container">

        <div class="cart-title">
            <h1>Your Cart</h1>
            <p class="cart-subtitle">Review your selected products</p>
        </div>

        <div id="cart" class="cart-container"></div>

        <div class="cart-summary-card">
            <div class="cart-total">
                <span>Total</span>
                <span class="total-price" id="total">₸ 0</span>
            </div>

            <div class="cart-actions">
                <button class="btn-primary" onclick="checkout()">
                    Checkout
                </button>

                <button class="btn-secondary" onclick="clearCart()">
                    Clear cart
                </button>
            </div>
        </div>

    </div>
</section>

<script src="cart.js"></script>
</body>
</html>
